name: zt_places
description: On-device place reminders (arrive / leave) and the shared place picker for Zero-Trust apps. No Google Play services; the location never leaves the phone.
version: 0.1.1
publish_to: none

environment:
  sdk: ^3.5.0
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  plugin:
    platforms:
      android:
        package: dev.sagron.zt_places
        pluginClass: ZtPlacesPlugin
