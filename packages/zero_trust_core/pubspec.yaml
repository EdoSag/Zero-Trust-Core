name: zero_trust_core
description: Account, keys, vault lock and shared UI for every Zero-Trust app.
version: 0.8.0
publish_to: none

environment:
  sdk: ^3.5.0
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  flutter_riverpod: ^3.0.0
  flutter_secure_storage: ^11.2.0
  local_auth: ^3.0.2
  clock: ^1.1.1
  cryptography: ^2.7.0
  dynamic_color: ^1.7.0
  http: ^1.2.0
  path_provider: ^2.1.6
  sqlite3: ^3.7.0
  supabase_flutter: ^2.9.0
  zt_crypto:
    path: ../zt_crypto
  archive: ^4.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  fake_async: ^1.3.1

# The encrypted SQLite build for this package's own tests. Each app sets the
# same in its own pubspec.yaml (see README), since only the app's counts.
hooks:
  user_defines:
    sqlite3:
      source: sqlite3mc

flutter:
  generate: true
