name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  zt_crypto:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: packages/zt_crypto } }
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with: { sdk: 3.13.7 } # the Dart in Flutter below; keeps formatting stable
      - run: dart pub get
      - run: dart format --output=none --set-exit-if-changed .
      - run: dart analyze --fatal-infos
      - run: dart test

  zt_release_checks:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: packages/zt_release_checks } }
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with: { sdk: 3.13.7 }
      - run: dart pub get
      - run: dart format --output=none --set-exit-if-changed .
      - run: dart analyze --fatal-infos
      - run: dart test

  zero_trust_core:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: packages/zero_trust_core } }
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable, flutter-version: 3.47.9 }
      - run: flutter pub get
      - name: Generated strings match lib/l10n/*.arb
        run: flutter gen-l10n && git diff --exit-code lib/src/l10n
      - run: dart format --output=none --set-exit-if-changed .
      - run: flutter analyze --fatal-infos
      - run: flutter test
      - name: The apps' release checks pass against this core, for every app
        run: |
          for app in notes tasks fitness contacts calendar phone browser time meds; do
            sed "s/{{APP_ID}}/$app/" ../zt_release_checks/templates/release_checks_test.dart \
              > "test/release_checks_${app}_test.dart"
          done
          flutter test test/release_checks_*_test.dart

  zt_sharing_ui:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: packages/zt_sharing_ui } }
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable, flutter-version: 3.47.9 }
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed .
      - run: flutter analyze --fatal-infos
      - run: flutter test

  zt_places:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: packages/zt_places } }
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable, flutter-version: 3.47.9 }
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed .
      - run: flutter analyze --fatal-infos
      - run: flutter test
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - name: Android code compiles (the plugin is plain Java, no Gradle needed)
        run: |
          mkdir -p /tmp/stub/androidx/annotation /tmp/out
          echo 'package androidx.annotation; public @interface NonNull {}' > /tmp/stub/androidx/annotation/NonNull.java
          EMB=$(cat "$FLUTTER_ROOT/bin/internal/engine.version")
          curl -sSfo /tmp/emb.jar "https://storage.googleapis.com/download.flutter.io/io/flutter/flutter_embedding_debug/1.0.0-$EMB/flutter_embedding_debug-1.0.0-$EMB.jar"
          PLATFORM=$(ls -d "$ANDROID_HOME"/platforms/android-* | sort -V | tail -1)
          javac -Xlint:-deprecation -d /tmp/out -cp "$PLATFORM/android.jar:/tmp/emb.jar" \
            /tmp/stub/androidx/annotation/NonNull.java android/src/main/java/dev/sagron/zt_places/*.java

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults: { run: { working-directory: packages/zero_trust_core/example } }
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable, flutter-version: 3.47.9 }
      - run: flutter pub get
      - run: flutter analyze --fatal-infos
      - run: ../../../tool/fetch_sqlite3mc_wasm.sh web/
      - run: flutter build web --no-web-resources-cdn

  database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: postgres }
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-retries 10
    env: { PGHOST: localhost, PGUSER: postgres, PGPASSWORD: postgres }
    steps:
      - uses: actions/checkout@v4
      - name: Apply every migration and run the database tests
        working-directory: supabase
        run: |
          psql -q -v ON_ERROR_STOP=1 -f tests/00_supabase_stub.sql \
            $(for f in migrations/*.sql; do echo -f "$f"; done) \
            -f tests/key_guard_test.sql -f tests/vault_items_test.sql \
            -f tests/attachments_test.sql \
            -f tests/storage_quota_test.sql \
            -f tests/drop_unused_tables_test.sql \
            -f tests/shared_spaces_test.sql \
            -f tests/plans_test.sql \
            -f tests/booking_pages_test.sql \
            -f tests/booking_slots_fixes_test.sql

  edge_functions:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: supabase/functions } }
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with: { deno-version: v2.x }
      - run: deno lint
      - run: deno check delete-account/index.ts
